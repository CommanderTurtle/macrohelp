[package]
name = "macrohelp-wayland"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
dotenvy = "0.15"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "macrohelp-httpd"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
